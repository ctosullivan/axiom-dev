name: deterministic-checks

# Runs the credential-free policy, validator, governed-document and whitespace
# checks on every push and PR. The ci-required summary job depends on all four:
# it fails if any required dependency failed, was skipped or was cancelled.
#
# IMPORTANT: a green workflow alone does NOT enforce merge safety.
# The repository owner must configure main's GitHub branch rules to require
# ci-required. See docs/ci-enforcement-setup.md and verify the live rule;
# never describe this as a required merge check before that verification.
# Codex review remains advisory (decisions/0005), outside deterministic CI.
#
# "Validate every governed documentation file" below also performs a
# repository-wide orphaned-schema scan as a side effect of calling
# axiom_validator's main() — not a separate step, since main() always
# scans --repo-root/schemas/ for orphans regardless of which paths are
# passed (contract revision rule 8). Schemas moved from colocated
# <doc>.md.schema.yaml files to a mirrored top-level schemas/ tree
# (prompt 005, decisions/0007) — the governed-document manifest moved
# with them, to schemas/governed-documents.txt. Test fixtures keep
# their own, separate tests/fixtures/schemas/ tree, which this job's
# orphan scan never touches (it only scans <repo_root>/schemas/), so
# the deliberately orphaned test fixture cannot fail this job.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run policy evaluator test suite
        run: |
          PYTHONPATH=.github/scripts python3 -m unittest discover -s .github/scripts/tests -v

  axiom-validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run axiom_validator test suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v

  validate-governed-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate every governed documentation file
        run: |
          mapfile -t FILES < <(grep -vE '^\s*(#|$)' schemas/governed-documents.txt)
          echo "Validating: ${FILES[@]}"
          PYTHONPATH=src python3 -m axiom_validator "${FILES[@]}" --repo-root .

  no-trailing-whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on trailing whitespace in tracked Markdown
        run: |
          if git grep -n --cached ' $' -- '*.md'; then
            echo "Trailing whitespace found (see above)." >&2
            exit 1
          fi
          echo "No trailing whitespace in tracked Markdown."

  # Stable, single GitHub required-check target; configure branch protection
  # separately. Do not add CI jobs above without adding them to needs below
  # AND to REQUIRED_JOBS in .github/scripts/ci_required_gate.py (a test
  # asserts the two stay in sync - .github/scripts/tests/test_ci_required_gate.py).
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - policy-evaluator-tests
      - axiom-validator-tests
      - validate-governed-documentation
      - no-trailing-whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require success from every dependent job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_required_gate.py
