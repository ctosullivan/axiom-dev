audience: whoever closes out a phase, archives it, or audits the archiving procedure
purpose: define the repeatable method for archiving a Completed phase without duplicating or altering its evidence
required_sections: [Archive structure, Phase completion procedure, Verification, Historical first use]
authoritative_sources: [AGENTS.md, planning/ROADMAP.md, evidence/phase-1-owner-acceptance.md]
acceptance_criteria:
  - the procedure can be followed by a fresh agent without inventing missing steps
  - human-approved exception handling does not falsely describe unmet criteria as passed
  - archive-entry verification reuses the existing validator rather than introducing new tooling
