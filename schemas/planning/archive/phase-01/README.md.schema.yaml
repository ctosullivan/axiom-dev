audience: contributors and reviewers examining the completed Phase 1 record
purpose: index canonical Phase 1 plans, decisions, contracts, evidence and owner-accepted qualifications
required_sections: [Status and accepted scope, Canonical record, Decisions and contracts, Remaining qualifications and follow-on work]
authoritative_sources: [planning/ROADMAP.md, evidence/phase-1-owner-acceptance.md, docs/phase-archiving.md]
acceptance_criteria:
